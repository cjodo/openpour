[package]
name = "openpour-sim"
version = "0.1.0"
edition = "2021"
description = "Runs the OpenPour firmware logic on a PC against simulated hardware, serving the real web app"
license = "MIT"

[dependencies]
pourcore = { path = "../pourcore" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
